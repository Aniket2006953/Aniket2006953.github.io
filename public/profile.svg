<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="240" height="240" rx="40" fill="url(#bgGrad)"/>
  
  <!-- Subtle tech circles -->
  <circle cx="120" cy="120" r="90" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 6"/>
  <circle cx="120" cy="120" r="105" stroke="#1e293b" stroke-width="1"/>

  <!-- Body / Shoulders -->
  <path d="M50 215 C50 165, 80 155, 120 155 C160 155, 190 165, 190 215" fill="url(#accentGrad)" opacity="0.95"/>
  <path d="M96 155 L120 180 L144 155 Z" fill="#ffffff" opacity="0.15"/>
  
  <!-- Neck -->
  <rect x="106" y="128" width="28" height="32" rx="6" fill="#e2e8f0"/>
  
  <!-- Head -->
  <ellipse cx="120" cy="104" rx="38" ry="44" fill="#f8fafc"/>
  
  <!-- Hair -->
  <path d="M82 92 C82 64, 98 52, 120 52 C142 52, 158 64, 158 92 C158 95, 156 90, 150 82 C140 70, 100 70, 90 82 C84 90, 82 95, 82 92 Z" fill="#0f172a"/>
  
  <!-- Modern glasses -->
  <rect x="94" y="94" width="22" height="16" rx="4" stroke="#0284c7" stroke-width="3" fill="#38bdf8" fill-opacity="0.15"/>
  <rect x="124" y="94" width="22" height="16" rx="4" stroke="#0284c7" stroke-width="3" fill="#38bdf8" fill-opacity="0.15"/>
  <line x1="116" y1="102" x2="124" y2="102" stroke="#0284c7" stroke-width="3"/>
  <line x1="86" y1="100" x2="94" y2="101" stroke="#0284c7" stroke-width="2.5"/>
  <line x1="146" y1="101" x2="154" y2="100" stroke="#0284c7" stroke-width="2.5"/>

  <!-- Smile -->
  <path d="M110 126 Q120 134 130 126" stroke="#475569" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  
  <!-- Floating Code Icon Accent -->
  <g transform="translate(164, 40)">
    <circle cx="16" cy="16" r="18" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="16" y="21" font-family="monospace" font-size="14" font-weight="bold" fill="#60a5fa" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
