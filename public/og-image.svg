<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f1115"/>
      <stop offset="100%" stop-color="#161922"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Accent Circle Glow -->
  <circle cx="1000" cy="200" r="280" fill="#1a73e8" opacity="0.15" filter="blur(60px)"/>

  <!-- Brand badge -->
  <rect x="100" y="100" width="48" height="48" rx="12" fill="url(#blueGlow)"/>
  <text x="124" y="132" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">A</text>
  <text x="165" y="131" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="1">ALEX CHEN • PORTFOLIO</text>

  <!-- Main Headline -->
  <text x="100" y="240" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="56" font-weight="800" letter-spacing="-1.5">
    Senior Software Engineer
  </text>
  <text x="100" y="310" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" letter-spacing="-1">
    &amp; Platform Architect
  </text>

  <!-- Subheadline -->
  <text x="100" y="380" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="400">
    Distributed systems, high-throughput cloud infrastructure, and reactive web apps.
  </text>

  <!-- Highlights Pills -->
  <g transform="translate(100, 440)">
    <rect x="0" y="0" width="160" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="80" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">TypeScript / React</text>

    <rect x="175" y="0" width="130" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="240" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Go / Cloud</text>

    <rect x="320" y="0" width="150" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="395" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Kubernetes</text>

    <rect x="485" y="0" width="170" height="42" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="570" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" text-anchor="middle">99.99% Availability</text>
  </g>
</svg>
